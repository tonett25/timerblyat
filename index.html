<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5 декабря • Обратный отсчёт</title>
  <style>
    :root {
      --bg: #070913;
      --card-bg: rgba(18, 22, 38, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --pink: #ff3366;
      --pink-glow: rgba(255, 51, 102, 0.45);
      --violet-glow: rgba(138, 43, 226, 0.35);
      --text: #f5f7fc;
      --subtext: #8d95af;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow: hidden;
      position: relative;
    }

    /* Фоновые градиентные сферы */
    .glow-orb-1 {
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, var(--pink-glow) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 1;
    }

    .glow-orb-2 {
      position: absolute;
      bottom: -15%;
      left: 50%;
      transform: translateX(-50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, var(--violet-glow) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
    }

    /* Холст с падающими частицами */
    #starsCanvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 10;
    }

    /* Маршрутный бейдж */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 99px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.6px;
      backdrop-filter: blur(16px);
      color: #e2e8f0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 10px var(--pink);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Заголовки */
    .header-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      line-height: 1.15;
    }

    .title span {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff8fa3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(255, 77, 109, 0.35));
    }

    .subtitle {
      font-size: 14px;
      color: var(--subtext);
      line-height: 1.5;
    }

    /* Сетка таймера */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    .time-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px 4px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
    }

    .time-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    }

    .time-val {
      font-size: 32px;
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", monospace;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .time-lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 8px;
    }

    /* Нижняя минималистичная полоска */
    .status-panel {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #cfd6e8;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .status-panel span:last-child {
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #ff8fa3;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="glow-orb-1"></div>
<div class="glow-orb-2"></div>
<canvas id="starsCanvas"></canvas>

<div class="container">
  
  <div class="badge">
    <div class="badge-dot"></div>
    <span>Поезд бля • Вологда ➔ Москва</span>
  </div>

  <div class="header-box">
    <h1 class="title">До <span>5 декабря</span></h1>
    <p class="subtitle">Отсчёт до охуенного дня.</p>
  </div>

  <div class="timer-grid">
    <div class="time-card">
      <div class="time-val" id="days">00</div>
      <div class="time-lbl">дней</div>
    </div>
    <div class="time-card">
      <div class="time-val" id="hours">00</div>
      <div class="time-lbl">часов</div>
    </div>
    <div class="time-card">
      <div class="time-val" id="minutes">00</div>
      <div class="time-lbl">минут</div>
    </div>
    <div class="time-card">
      <div class="time-val" id="seconds">00</div>
      <div class="time-lbl">секунд</div>
    </div>
  </div>

  <div class="status-panel">
    <span>Точка ебейшего дня</span>
    <span>05.12 • 00:00:00</span>
  </div>

</div>

<script>
  // Логика таймера
  function updateCountdown() {
    const now = new Date();
    let currentYear = now.getFullYear();
    let target = new Date(currentYear, 11, 5, 0, 0, 0); // Декабрь (индекс 11)

    // Если дата уже прошла в текущем году — отсчитываем до следующего 5 декабря
    if (now.getTime() > target.getTime()) {
      target = new Date(currentYear + 1, 11, 5, 0, 0, 0);
    }

    const diff = target.getTime() - now.getTime();

    if (diff <= 0) {
      document.getElementById('days').innerText = "00";
      document.getElementById('hours').innerText = "00";
      document.getElementById('minutes').innerText = "00";
      document.getElementById('seconds').innerText = "00";
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    document.getElementById('days').innerText = String(d).padStart(2, '0');
    document.getElementById('hours').innerText = String(h).padStart(2, '0');
    document.getElementById('minutes').innerText = String(m).padStart(2, '0');
    document.getElementById('seconds').innerText = String(s).padStart(2, '0');
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();

  // Фоновая ненавязчивая анимация мерцающих звёзд
  const canvas = document.getElementById('starsCanvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const particles = Array.from({ length: 45 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    size: Math.random() * 1.5 + 0.5,
    speed: Math.random() * 0.2 + 0.05,
    alpha: Math.random() * 0.7 + 0.2,
    alphaChange: (Math.random() * 0.01 + 0.005) * (Math.random() < 0.5 ? 1 : -1)
  }));

  function renderParticles() {
    ctx.clearRect(0, 0, width, height);
    particles.forEach(p => {
      p.y -= p.speed;
      if (p.y < 0) p.y = height;

      p.alpha += p.alphaChange;
      if (p.alpha > 0.85 || p.alpha < 0.15) p.alphaChange *= -1;

      ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(renderParticles);
  }
  renderParticles();
</script>

</body>
</html>
